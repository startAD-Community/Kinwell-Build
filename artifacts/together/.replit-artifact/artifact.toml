kind = "web"
previewPath = "/"
title = "Kinwell"
description = "Reassuring guidance for first-time parents: understand what may be happening, prepare for what comes next, and coordinate care."
version = "1.0.0"
id = "artifacts/together"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25176

[services.development]
run = "pnpm --filter @workspace/together run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/together", "run", "build" ]
serve = "static"
publicDir = "artifacts/together/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25176"
BASE_PATH = "/"
